map $host $fleshlab_spa_index {
  default /index.html;
  admin.fleshlab.online /admin/admin.html;
  earn.fleshlab.online /earn/earn.html;
}

# The Performer Portal has its own Vite base (/performer/) and must not fall
# through the shared-host SPA map.  Serving its shell from a dedicated root
# prevents an older shared entry file from pinning an obsolete hashed bundle.
server {
  listen 8080;
  server_name performer.fleshlab.online;
  root /usr/share/nginx/html/performer;
  index performer.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $fleshlab_seo_robots always;

  location ~ ^/api/v3/creator/submissions/(identity/documents/[^/]+|[^/]+)/upload$ {
    client_max_body_size 20g; client_body_timeout 3600s; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 3600s; proxy_send_timeout 3600s;
    proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/api/v3/creator/media/[^/]+/upload$ {
    client_max_body_size 20m; client_body_timeout 900s; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 900s; proxy_send_timeout 900s;
    proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

  # Vite emits /performer/assets/*; map that prefix to this vhost's current
  # build directory while all portal routes fall back to performer.html.
  location ^~ /performer/assets/ { alias /usr/share/nginx/html/performer/assets/; add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location = /performer { try_files /performer.html =404; }
  location = /performer/ { try_files /performer.html =404; }
  location / { try_files $uri $uri/ /performer.html; }
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag $fleshlab_seo_robots always;
  sub_filter_types text/html;
  sub_filter_once off;
  sub_filter '__FLESHLAB_ROBOTS__' $fleshlab_seo_robots;
  sub_filter '__FLESHLAB_CANONICAL__' $fleshlab_seo_canonical;
  # Catalogue imports are administrator-only and accept the four Base44 JSON
  # envelopes in a single request. Keep the regular application API limit at
  # 1 MiB; only these two explicit, authenticated migration endpoints allow
  # the bounded 25 MiB import envelope.
  location ~ ^/api/v1/admin/imports/base44/catalogue/(dry-run|execute)$ {
    client_max_body_size 25m;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Creator video uploads are streamed through the authenticated API because
  # private Blob Storage denies public-browser network access. Do not buffer a
  # multi-GB creator file in nginx or apply the regular 1 MiB JSON API limit.
  location ~ ^/api/v3/creator/submissions/(identity/documents/[^/]+|[^/]+)/upload$ {
    client_max_body_size 20g;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/api/v3/creator/media/[^/]+/upload$ {
    client_max_body_size 20m;
    client_body_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /admin { if ($host != admin.fleshlab.online) { return 404; } try_files /admin/admin.html =404; }
  location ^~ /admin/ { if ($host != admin.fleshlab.online) { return 404; } try_files $uri =404; }
  location = /performer { if ($host != performer.fleshlab.online) { return 404; } try_files /performer/performer.html =404; }
  location ^~ /performer/ { if ($host != performer.fleshlab.online) { return 404; } try_files $uri =404; }
  location = /earn { if ($host != earn.fleshlab.online) { return 404; } try_files /earn/earn.html =404; }
  location ^~ /earn/ { if ($host != earn.fleshlab.online) { return 404; } try_files $uri =404; }
  location = /v3 { if ($host = admin.fleshlab.online) { return 404; } if ($host = performer.fleshlab.online) { return 404; } if ($host = earn.fleshlab.online) { return 404; } add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; add_header X-Robots-Tag $fleshlab_seo_robots always; return 301 /v3/; }
  # The V3 shell contains the current hashed bundle names. Keep the shell
  # revalidated so a newly deployed recruitment experience is visible without
  # waiting for the old HTML to expire at the edge.
  location ^~ /v3/assets/ { if ($host = admin.fleshlab.online) { return 404; } if ($host = performer.fleshlab.online) { return 404; } if ($host = earn.fleshlab.online) { return 404; } add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Robots-Tag $fleshlab_seo_robots always; try_files $uri =404; }
  location /v3/ { if ($host = admin.fleshlab.online) { return 404; } if ($host = performer.fleshlab.online) { return 404; } if ($host = earn.fleshlab.online) { return 404; } add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always; add_header X-Robots-Tag $fleshlab_seo_robots always; try_files $uri $uri/ /v3/index.html; }
  location = / {
    try_files $fleshlab_spa_index =404;
  }
  location / { try_files $uri $uri/ $fleshlab_spa_index; }
}
