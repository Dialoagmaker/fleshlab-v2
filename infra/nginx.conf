map $host $fleshlab_spa_index {
  default /index.html;
  earn.fleshlab.online /v3/index.html;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Catalogue imports are administrator-only and accept the four Base44 JSON
  # envelopes in a single request. Keep the regular application API limit at
  # 1 MiB; only these two explicit, authenticated migration endpoints allow
  # the bounded 25 MiB import envelope.
  location ~ ^/api/v1/admin/imports/base44/catalogue/(dry-run|execute)$ {
    client_max_body_size 25m;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Creator video uploads are streamed through the authenticated API because
  # private Blob Storage denies public-browser network access. Do not buffer a
  # multi-GB creator file in nginx or apply the regular 1 MiB JSON API limit.
  location ~ ^/api/v3/creator/submissions/(identity/documents/[^/]+|[^/]+)/upload$ {
    client_max_body_size 20g;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /v3 { return 301 /v3/; }
  location /v3/ { try_files $uri $uri/ /v3/index.html; }
  location = / {
    error_page 418 = /v3/index.html;
    if ($host = earn.fleshlab.online) { return 418; }
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/ $fleshlab_spa_index; }
}
