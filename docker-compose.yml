services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleshlab
      POSTGRES_USER: fleshlab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleshlab -d fleshlab"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleshlab
      POSTGRES_USER: fleshlab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      EARN_ORIGIN: ${EARN_ORIGIN}
      COOKIE_SECURE: "true"
      SESSION_SECRET_FILE: /run/secrets/session_secret
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL}
      PRIVATE_UPLOAD_CONTAINER: private-uploads
      FLESHLAB_MEDIA_MIGRATION_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    secrets: [postgres_password, session_secret]
  worker:
    build:
      context: .
      target: api
    command: ["node", "server/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      POSTGRES_HOST: postgres
      POSTGRES_DB: fleshlab
      POSTGRES_USER: fleshlab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      EARN_ORIGIN: ${EARN_ORIGIN}
      COOKIE_SECURE: "true"
      SESSION_SECRET_FILE: /run/secrets/session_secret
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL}
      PRIVATE_UPLOAD_CONTAINER: private-uploads
      FLESHLAB_MEDIA_MIGRATION_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
    secrets: [postgres_password, session_secret]
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on: [api]
  edge:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      EARN_HOST: ${EARN_HOST}
    ports: ["443:443"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE}
  session_secret:
    file: ${SESSION_SECRET_FILE}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
